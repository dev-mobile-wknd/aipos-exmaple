name: Advisor

options:
  bundleIdPrefix: com.weekendinc.example

packages:
  AIPosSDK:
    url: https://github.com/dev-mobile-wknd/swift-aipos-sdk
    from: 0.1.0

targets:
  Advisor:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Sources
    dependencies:
      - package: AIPosSDK
        product: AIPosSDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weekendinc.example.advisor
        PRODUCT_NAME: AiposAdvisorExample
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "AIPos — Advisor"
